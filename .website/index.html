<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="华南农业大学课程试卷、答案、课件与复习资料索引。" />
    <meta name="theme-color" content="#176b4b" />
    <title>华南农业大学学习资料库</title>
    <script>
      try {
        const theme = localStorage.getItem('scau-learn.theme');
        if (theme === 'dark' || (!theme && matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.dataset.theme = 'dark';
        }
      } catch {}
    </script>
  </head>
  <body>
    <a class="skip-link" href="#main-content">跳到正文</a>
    <div class="app-shell">
      <button class="nav-scrim" id="nav-scrim" type="button" aria-label="关闭课程导航"></button>

      <aside class="sidebar" id="sidebar" aria-label="站点导航">
        <a class="brand" href="#/" aria-label="返回资料库首页">
          <span class="brand-mark"><img src="./picture/logo_green.svg" alt="" /></span>
          <span class="brand-copy">
            <strong>SCAU 学习资料库</strong>
            <small>课程资料索引</small>
          </span>
        </a>

        <div class="search-box">
          <i data-lucide="search" aria-hidden="true"></i>
          <label class="sr-only" for="course-search">搜索课程或页面</label>
          <input id="course-search" type="search" placeholder="搜索课程或页面" autocomplete="off" />
          <button id="clear-search" class="clear-search icon-button" type="button" aria-label="清空搜索" title="清空搜索">
            <i data-lucide="x" aria-hidden="true"></i>
          </button>
        </div>
        <p class="search-status" id="search-status" aria-live="polite"></p>

        <nav class="library-nav" id="library-nav" aria-label="课程资料"></nav>

        <div class="sidebar-footer">
          <a class="repo-link" href="https://github.com/AntheaLaffy/SCAU-learn" target="_blank" rel="noreferrer">
            <i data-lucide="github" aria-hidden="true"></i>
            <span>查看 GitHub 仓库</span>
            <i data-lucide="external-link" aria-hidden="true"></i>
          </a>
          <button class="icon-button" id="theme-toggle" type="button" aria-label="切换深色模式" title="切换深色模式">
            <i data-lucide="moon" aria-hidden="true"></i>
          </button>
        </div>
      </aside>

      <header class="mobile-header">
        <button class="icon-button" id="menu-toggle" type="button" aria-label="打开课程导航" aria-controls="sidebar" aria-expanded="false" title="打开课程导航">
          <i data-lucide="menu" aria-hidden="true"></i>
        </button>
        <a href="#/" class="mobile-brand">SCAU 学习资料库</a>
        <button class="icon-button" id="mobile-theme-toggle" type="button" aria-label="切换深色模式" title="切换深色模式">
          <i data-lucide="moon" aria-hidden="true"></i>
        </button>
      </header>

      <main class="main" id="main-content" tabindex="-1">
        <div class="content-frame" id="page-view" aria-live="polite"></div>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
